<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지구 외핵 다이너모 시뮬레이션 </title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }
        .control-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(15, 15, 25, 0.85);
            padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 280px; z-index: 10;
        }
        .control-panel h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #4dadff; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        .slider-group span { float: right; font-weight: bold; color: #fff; }
        .slider-group input[type="range"] { width: 100%; accent-color: #4dadff; }
        
        /* 토글 스위치 스타일링 */
        .toggle-group { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #ccc; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .3s; border-radius: 22px; }
        .slider-toggle:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider-toggle { background-color: #4dadff; }
        input:checked + .slider-toggle:before { transform: translateX(22px); }

        .btn-reset { width: 100%; background: #4dadff; border: none; color: #000; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .instruction { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 14px; color: #aaa; z-index: 10; }
        .instruction span { color: #4dadff; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="control-panel">
        <h3>Dynamo 2.6 Boundary Switch</h3>
        <div class="slider-group">
            <label>자전 각속도 (Ω): <span id="val-omega">8.0</span></label>
            <input type="range" id="slip-omega" min="0" max="15" step="0.1" value="8.0">
        </div>
        <div class="slider-group">
            <label>자기 제동 계수 (γ): <span id="val-gamma">0.02</span></label>
            <input type="range" id="slip-gamma" min="0" max="0.5" step="0.01" value="0.02">
        </div>
        <div class="slider-group">
            <label>공간 매핑 상수 (A_b): <span id="val-ab">0.35</span></label>
            <input type="range" id="slip-ab" min="0.1" max="1.5" step="0.01" value="0.35">
        </div>
        <div class="slider-group">
            <label>만유인력 상수 (GM): <span id="val-gm">20.0</span></label>
            <input type="range" id="slip-gm" min="0" max="40" step="0.5" value="20.0">
        </div>

        <div class="toggle-group">
            <label for="toggle-boundary">외핵 경계벽(물리 차단) 활성화</label>
            <label class="switch">
                <input type="checkbox" id="toggle-boundary" checked>
                <span class="slider-toggle"></span>
            </label>
        </div>

        <button class="btn-reset" onclick="clearTrajectories()">궤적 초기화</button>
    </div>

    <div class="instruction">
        토글 스위치로 <span>경계 조건</span>을 변경하며 반지름 고정 현상 비교 관찰
    </div>

    <div id="canvas-container"></div>

    <script>
        let Omega = 8.0; 
        let gamma = 0.02;
        let A_b = 0.35; 
        let GM = 20.0;
        let useBoundary = true; // 경계 조건 활성화 여부 변수
        const dt = 0.003; 
        const maxSteps = 6000; 

        let scene, camera, renderer, controls, outerCoreSphere, innerCoreSphere;
        let raycaster, mouse;
        let activeParticles = [];

        const slipOmega = document.getElementById('slip-omega');
        const slipGamma = document.getElementById('slip-gamma');
        const slipAb = document.getElementById('slip-ab');
        const slipGm = document.getElementById('slip-gm');
        const toggleBoundary = document.getElementById('toggle-boundary');

        slipOmega.addEventListener('input', (e) => { Omega = parseFloat(e.target.value); document.getElementById('val-omega').innerText = Omega.toFixed(1); });
        slipGamma.addEventListener('input', (e) => { gamma = parseFloat(e.target.value); document.getElementById('val-gamma').innerText = gamma.toFixed(2); });
        slipAb.addEventListener('input', (e) => { A_b = parseFloat(e.target.value); document.getElementById('val-ab').innerText = A_b.toFixed(2); });
        slipGm.addEventListener('input', (e) => { GM = parseFloat(e.target.value); document.getElementById('val-gm').innerText = GM.toFixed(1); });
        
        // 토글 이벤트 리스너: 체크박스 상태에 따라 물리 계산 스위칭 및 시각적 격자 구체 숨김/노출
        toggleBoundary.addEventListener('change', (e) => { 
            useBoundary = e.target.checked; 
            outerCoreSphere.visible = useBoundary;
            innerCoreSphere.visible = useBoundary;
        });

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 12, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 외핵 바깥 벽 (CMB - 반지름 4)
            const outerGeo = new THREE.SphereGeometry(4, 32, 16);
            const outerMat = new THREE.MeshBasicMaterial({ color: 0x555577, wireframe: true, transparent: true, opacity: 0.05 });
            outerCoreSphere = new THREE.Mesh(outerGeo, outerMat);
            scene.add(outerCoreSphere);

            // 외핵 안쪽 벽 (ICB - 반지름 1.5)
            const innerGeo = new THREE.SphereGeometry(1.5, 24, 12);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, wireframe: true, transparent: true, opacity: 0.08 });
            innerCoreSphere = new THREE.Mesh(innerGeo, innerMat);
            scene.add(innerCoreSphere);

            // 자전축 (시각적 Y축)
            const zAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -8, 0), new THREE.Vector3(0, 8, 0)]);
            const zAxis = new THREE.Line(zAxisGeo, new THREE.LineBasicMaterial({ color: 0xff3333, opacity: 0.3, transparent: true }));
            scene.add(zAxis);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('click', onFreeSpaceClick, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onFreeSpaceClick(event) {
            // 조작 패널 영역 클릭 차단 (토글 스위치 조작 영역까지 커버하도록 범위 확장)
            if (event.clientX < 320 && event.clientY < 380) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            const targetPlaneProjector = new THREE.Vector3(mouse.x, mouse.y, 0.5).unproject(camera);
            targetPlaneProjector.sub(camera.position).normalize();
            
            const distance = camera.position.distanceTo(controls.target);
            const pt = new THREE.Vector3().copy(camera.position).add(targetPlaneProjector.multiplyScalar(distance));

            const particle = {
                x: pt.x, y: pt.z, z: pt.y,
                vx: 0.3, vy: -0.2, vz: 0.4, 
                stepCount: 0,
                points: [pt.clone()],
                geometry: new THREE.BufferGeometry(),
                material: new THREE.LineBasicMaterial({ color: new THREE.Color().setHSL(Math.random(), 1.0, 0.6), linewidth: 2 }),
                lineMesh: null
            };

            particle.lineMesh = new THREE.Line(particle.geometry, particle.material);
            scene.add(particle.lineMesh);
            activeParticles.push(particle);
        }

        function calculateDynamoStep() {
            activeParticles.forEach((p) => {
                if (p.stepCount >= maxSteps) return;

                for (let i = 0; i < 8; i++) {
                    if (p.stepCount >= maxSteps) break;

                    let R_sq = p.x*p.x + p.y*p.y + p.z*p.z;
                    let R = Math.sqrt(R_sq);
                    
                    // [실시간 분기] 토글이 켜져있을 때만 경계 충돌 물리 적용
                    if (useBoundary) {
                        // 1. 바깥 벽 차단 (R=4)
                        if (R >= 4.0) {
                            const nx = p.x / R; const ny = p.y / R; const nz = p.z / R;
                            const v_dot_n = p.vx*nx + p.vy*ny + p.vz*nz;
                            if (v_dot_n > 0) {
                                p.vx -= v_dot_n * nx; p.vy -= v_dot_n * ny; p.vz -= v_dot_n * nz;
                            }
                            p.x = nx * 3.98; p.y = ny * 3.98; p.z = nz * 3.98;
                            R = 3.98; R_sq = R*R;
                        }
                        // 2. 안쪽 벽 차단 (R=1.5)
                        if (R <= 1.5) {
                            const nx = p.x / R; const ny = p.y / R; const nz = p.z / R;
                            const v_dot_n = p.vx*nx + p.vy*ny + p.vz*nz;
                            if (v_dot_n < 0) {
                                p.vx -= v_dot_n * nx * 1.5; p.vy -= v_dot_n * ny * 1.5; p.vz -= v_dot_n * nz * 1.5;
                            }
                            p.x = nx * 1.52; p.y = ny * 1.52; p.z = nz * 1.52;
                            R = 1.52; R_sq = R*R;
                        }
                    } else {
                        // 토글이 꺼져있을 때(무한 유체 스페이스) 최소 중심 붕괴만 방지
                        if (R < 0.4) { R = 0.4; R_sq = R*R; }
                    }

                    const safeR = R;
                    const fieldFactor = (GM * (A_b * safeR - 1.0)) / (safeR * safeR * safeR);

                    const ax =  2 * Omega * p.vy - gamma * p.vx + fieldFactor * p.x;
                    const ay = -2 * Omega * p.vx - gamma * p.vy + fieldFactor * p.y;
                    const az =                   - gamma * p.vz + fieldFactor * p.z;

                    let next_vx = p.vx + ax * dt;
                    let next_vy = p.vy + ay * dt;
                    let next_vz = p.vz + az * dt;

                    p.x += next_vx * dt;
                    p.y += next_vy * dt;
                    p.z += next_vz * dt;

                    p.vx = next_vx;
                    p.vy = next_vy;
                    p.vz = next_vz;

                    // 경계가 꺼진 상태에서 입자가 화면 밖으로 너무 멀어지면 연산 강제 종료
                    if (isNaN(p.x) || Math.abs(p.x) > 100) {
                        p.stepCount = maxSteps;
                        break;
                    }

                    p.points.push(new THREE.Vector3(p.x, p.z, p.y));
                    p.stepCount++;
                }
                p.geometry.setFromPoints(p.points);
            });
        }

        function clearTrajectories() {
            activeParticles.forEach(p => { scene.remove(p.lineMesh); p.geometry.dispose(); p.material.dispose(); });
            activeParticles = [];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            calculateDynamoStep();
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
