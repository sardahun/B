<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지구 외핵 방사형 다이너모 시뮬레이션 </title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }
        .control-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(15, 15, 25, 0.85);
            padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 280px; z-index: 10;
        }
        .control-panel h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #4dadff; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        .slider-group span { float: right; font-weight: bold; color: #fff; }
        .slider-group input[type="range"] { width: 100%; accent-color: #4dadff; }
        .btn-reset { width: 100%; background: #4dadff; border: none; color: #000; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .instruction { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 14px; color: #aaa; z-index: 10; }
        .instruction span { color: #4dadff; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="control-panel">
        <h3>Dynamo 2.2 Parameters</h3>
        <div class="slider-group">
            <label>자전 각속도 (Ω): <span id="val-omega">4.0</span></label>
            <input type="range" id="slip-omega" min="0" max="10" step="0.1" value="4.0">
        </div>
        <div class="slider-group">
            <label>자기 제동 계수 (γ): <span id="val-gamma">0.05</span></label>
            <input type="range" id="slip-gamma" min="0" max="1" step="0.01" value="0.05">
        </div>
        <div class="slider-group">
            <label>방사형 부력 (a_b): <span id="val-ab">3.0</span></label>
            <input type="range" id="slip-ab" min="0" max="10" step="0.1" value="3.0">
        </div>
        <div class="slider-group">
            <label>만유인력 상수 (GM): <span id="val-gm">12.0</span></label>
            <input type="range" id="slip-gm" min="0" max="30" step="0.5" value="12.0">
        </div>
        <button class="btn-reset" onclick="clearTrajectories()">궤적 초기화</button>
    </div>

    <div class="instruction">
        마우스 드래그로 <span>회전</span> | 구체 가이드라인 안팎을 <span>클릭</span>하여 정석 나선 진동 궤적 생성
    </div>

    <div id="canvas-container"></div>

    <script>
        // 전역 물리 변수 세팅
        let Omega = 4.0;
        let gamma = 0.05;
        let a_b = 3.0;
        let GM = 12.0;
        const dt = 0.003; // 미방 정확도를 위해 시간 간격을 조금 더 촘촘하게 세팅
        const maxSteps = 5000;

        let scene, camera, renderer, controls, earthSphere;
        let raycaster, mouse;
        let activeParticles = [];

        // UI 이벤트 바인딩
        const slipOmega = document.getElementById('slip-omega');
        const slipGamma = document.getElementById('slip-gamma');
        const slipAb = document.getElementById('slip-ab');
        const slipGm = document.getElementById('slip-gm');

        slipOmega.addEventListener('input', (e) => { Omega = parseFloat(e.target.value); document.getElementById('val-omega').innerText = Omega.toFixed(1); });
        slipGamma.addEventListener('input', (e) => { gamma = parseFloat(e.target.value); document.getElementById('val-gamma').innerText = gamma.toFixed(2); });
        slipAb.addEventListener('input', (e) => { a_b = parseFloat(e.target.value); document.getElementById('val-ab').innerText = a_b.toFixed(1); });        slipGm.addEventListener('input', (e) => { GM = parseFloat(e.target.value); document.getElementById('val-gm').innerText = GM.toFixed(1); });

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 외핵 반지름 가이드선 구체 (반지름 4)
            const sphereGeo = new THREE.SphereGeometry(4, 32, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x555577, wireframe: true, transparent: true, opacity: 0.1 });
            earthSphere = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(earthSphere);

            // 자전축 표시 (시각적 Y축을 자전축으로 매핑)
            const zAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -8, 0), new THREE.Vector3(0, 8, 0)]);
            const zAxis = new THREE.Line(zAxisGeo, new THREE.LineBasicMaterial({ color: 0xff3333, opacity: 0.3, transparent: true }));
            scene.add(zAxis);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('click', onSphereClick, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onSphereClick(event) {
            if (event.clientX < 320 && event.clientY < 350) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earthSphere);

            if (intersects.length > 0) {
                const pt = intersects[0].point;

                // 물리 미방 계산 좌표계(z가 자전축)와 Three.js 좌표계(Y가 상단축) 싱크 매핑
                const particle = {
                    x: pt.x, y: pt.z, z: pt.y,
                    vx: 0.8, vy: -0.4, vz: 0.5, // 3차원 나선 운동 유도를 위한 초기 가속 섭동값
                    stepCount: 0,
                    points: [pt.clone()],
                    geometry: new THREE.BufferGeometry(),
                    material: new THREE.LineBasicMaterial({ color: new THREE.Color().setHSL(Math.random(), 1.0, 0.6), linewidth: 2 }),
                    lineMesh: null
                };

                particle.lineMesh = new THREE.Line(particle.geometry, particle.material);
                scene.add(particle.lineMesh);
                activeParticles.push(particle);
            }
        }

        // --- 물리 이산화 연산의 핵심 핵심 파트 ---
        function calculateDynamoStep() {
            activeParticles.forEach((p) => {
                if (p.stepCount >= maxSteps) return;

                // 실시간 프레임 드랍 방지를 위해 한 프레임당 8스텝씩 이산화 전개
                for (let i = 0; i < 8; i++) {
                    if (p.stepCount >= maxSteps) break;

                    // 진짜 3차원 공간 거리 R계산 (R^2 = x^2 + y^2 + z^2)
                    const R_sq = p.x*p.x + p.y*p.y + p.z*p.z;
                    const R = Math.sqrt(R_sq);
                    const safeR = R < 1e-3 ? 1e-3 : R; // 중심 특이점 발산 방지 안전장치

                    // 공통 기하학적 인자 계산: (a_b - 1 ) * (GM / R^3)
                    // 부력 벡터(a_b * x/R)와 중력 벡터(-GM * x/R^3)가 방향코사인 성분으로 묶인 형태
                    const fieldFactor = (a_b -1) * (GM / (safeR * safeR * safeR))

                    // 뉴턴 역학 + 코리올리 힘 이산화 가속도 수식
                    const ax =  2 * Omega * p.vy - gamma * p.vx + fieldFactor * p.x;
                    const ay = -2 * Omega * p.vx - gamma * p.vy + fieldFactor * p.y;
                    const az =                   - gamma * p.vz + fieldFactor * p.z;

                    // 오일러-크로머 기법 기반의 속도 및 위치 이산화 업데이트
                    p.vx += ax * dt;
                    p.vy += ay * dt;
                    p.vz += az * dt;

                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.z += p.vz * dt;

                    // 계산된 물리 좌표계를 다시 Three.js 화면 좌표계(Y-up)로 변환해 저장
                    p.points.push(new THREE.Vector3(p.x, p.z, p.y));
                    p.stepCount++;
                }
                p.geometry.setFromPoints(p.points);
            });
        }

        function clearTrajectories() {
            activeParticles.forEach(p => { scene.remove(p.lineMesh); p.geometry.dispose(); p.material.dispose(); });
            activeParticles = [];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            calculateDynamoStep();
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
