<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지구 외핵 다이너모 정석 시뮬레이션 </title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }
        .control-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(15, 15, 25, 0.85);
            padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 280px; z-index: 10;
        }
        .control-panel h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #4dadff; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        .slider-group span { float: right; font-weight: bold; color: #fff; }
        .slider-group input[type="range"] { width: 100%; accent-color: #4dadff; }
        .btn-reset { width: 100%; background: #4dadff; border: none; color: #000; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .instruction { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 14px; color: #aaa; z-index: 10; }
        .instruction span { color: #4dadff; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="control-panel">
        <h3>Dynamo 2.2 Final Mesh</h3>
        <div class="slider-group">
            <label>자전 각속도 (Ω): <span id="val-omega">6.0</span></label>
            <input type="range" id="slip-omega" min="0" max="15" step="0.1" value="6.0">
        </div>
        <div class="slider-group">
            <label>자기 제동 계수 (γ): <span id="val-gamma">0.03</span></label>
            <input type="range" id="slip-gamma" min="0" max="0.5" step="0.01" value="0.03">
        </div>
        <div class="slider-group">
            <label>공간 매핑 상수 (A_b): <span id="val-ab">0.40</span></label>
            <input type="range" id="slip-ab" min="0.1" max="1.5" step="0.01" value="0.40">
        </div>
        <div class="slider-group">
            <label>만유인력 상수 (GM): <span id="val-gm">15.0</span></label>
            <input type="range" id="slip-gm" min="0" max="40" step="0.5" value="15.0">
        </div>
        <button class="btn-reset" onclick="clearTrajectories()">궤적 초기화</button>
    </div>

    <div class="instruction">
        마우스 드래그로 <span>회전</span> | 구체 가이드라인 안쪽을 <span>클릭</span>하여 정석 나선 기둥 생성
    </div>

    <div id="canvas-container"></div>

    <script>
        // 전역 물리 변수 초기 세팅
        let Omega = 6.0;
        let gamma = 0.03;
        let A_b = 0.40; // 평형점 조절을 위한 공간 스케일링 상수 (1 / 0.4 = 반지름 2.5 지점이 밸런스 벽)
        let GM = 15.0;
        const dt = 0.003; 
        const maxSteps = 6000; 

        let scene, camera, renderer, controls, earthSphere;
        let raycaster, mouse;
        let activeParticles = [];

        // UI 이벤트 동적 매핑
        const slipOmega = document.getElementById('slip-omega');
        const slipGamma = document.getElementById('slip-gamma');
        const slipAb = document.getElementById('slip-ab');
        const slipGm = document.getElementById('slip-gm');

        slipOmega.addEventListener('input', (e) => { Omega = parseFloat(e.target.value); document.getElementById('val-omega').innerText = Omega.toFixed(1); });
        slipGamma.addEventListener('input', (e) => { gamma = parseFloat(e.target.value); document.getElementById('val-gamma').innerText = gamma.toFixed(2); });
        slipAb.addEventListener('input', (e) => { A_b = parseFloat(e.target.value); document.getElementById('val-ab').innerText = A_b.toFixed(2); });
        slipGm.addEventListener('input', (e) => { GM = parseFloat(e.target.value); document.getElementById('val-gm').innerText = GM.toFixed(1); });

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 12, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 외핵 반지름 가이드선 구체 (반지름 4)
            const sphereGeo = new THREE.SphereGeometry(4, 32, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x555577, wireframe: true, transparent: true, opacity: 0.1 });
            earthSphere = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(earthSphere);

            // 자전축 표시 (시각적 Y축을 자전축으로 매핑)
            const zAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -8, 0), new THREE.Vector3(0, 8, 0)]);
            const zAxis = new THREE.Line(zAxisGeo, new THREE.LineBasicMaterial({ color: 0xff3333, opacity: 0.25, transparent: true }));
            scene.add(zAxis);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('click', onSphereClick, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onSphereClick(event) {
            if (event.clientX < 320 && event.clientY < 350) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earthSphere);

            if (intersects.length > 0) {
                const pt = intersects[0].point;

                // 물리 계산 좌표계(z가 자전축)와 Three.js 화면 좌표계(Y가 상단축) 싱크 매핑
                const particle = {
                    x: pt.x, y: pt.z, z: pt.y,
                    vx: 0.6, vy: -0.4, vz: 0.7, // 초기 수용돌이 나선을 뽑아내기 위한 3차원 속도 섭동
                    stepCount: 0,
                    points: [pt.clone()],
                    geometry: new THREE.BufferGeometry(),
                    material: new THREE.LineBasicMaterial({ color: new THREE.Color().setHSL(Math.random(), 1.0, 0.6), linewidth: 2 }),
                    lineMesh: null
                };

                particle.lineMesh = new THREE.Line(particle.geometry, particle.material);
                scene.add(particle.lineMesh);
                activeParticles.push(particle);
            }
        }

        // --- 물리 이산화 연산 파트 (네가 묶어준 수식 보완본) ---
        function calculateDynamoStep() {
            activeParticles.forEach((p) => {
                if (p.stepCount >= maxSteps) return;

                for (let i = 0; i < 8; i++) {
                    if (p.stepCount >= maxSteps) break;

                    // 1. 진짜 3차원 공간 거리 R 계산
                    const R_sq = p.x*p.x + p.y*p.y + p.z*p.z;
                    const R = Math.sqrt(R_sq);
                    
                    // [핵심 보안 1] 중심점 분모 폭발(Infinity) 방지 하한선 지정
                    const safeR = R < 0.6 ? 0.6 : R; 

                    // [핵심 보안 2] 네가 유도한 수식 부호 및 밸런스 정규화 매핑: (1.0 - A_b * R) * GM / R^3
                    // R > 2.5 이면 음수가 되어 안쪽으로 당기고, R < 2.5 이면 양수가 되어 밖으로 밀어냄
                    const fieldFactor = - (GM * (1.0 - A_b * safeR)) / (safeR * safeR * safeR);

                    // 2. 정석 다이너모 지배 방정식 가속도 계산
                    const ax =  2 * Omega * p.vy - gamma * p.vx + fieldFactor * p.x;
                    const ay = -2 * Omega * p.vx - gamma * p.vy + fieldFactor * p.y;
                    const az =                   - gamma * p.vz + fieldFactor * p.z;

                    // [핵심 보안 3] 속도 예측 제어 기법(Semi-implicit Euler)으로 튕김 현상 억제
                    let next_vx = p.vx + ax * dt;
                    let next_vy = p.vy + ay * dt;
                    let next_vz = p.vz + az * dt;

                    p.x += next_vx * dt;
                    p.y += next_vy * dt;
                    p.z += next_vz * dt;

                    p.vx = next_vx;
                    p.vy = next_vy;
                    p.vz = next_vz;

                    // 계산 중 발생할 수 있는 이상치(NaN) 필터링 2차 안전장치
                    if (isNaN(p.x) || Math.abs(p.x) > 50) {
                        p.stepCount = maxSteps;
                        break;
                    }

                    // 계산된 물리 좌표계를 다시 Three.js 화면 좌표계(Y-up)로 변환해 저장
                    p.points.push(new THREE.Vector3(p.x, p.z, p.y));
                    p.stepCount++;
                }
                p.geometry.setFromPoints(p.points);
            });
        }

        function clearTrajectories() {
            activeParticles.forEach(p => { scene.remove(p.lineMesh); p.geometry.dispose(); p.material.dispose(); });
            activeParticles = [];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            calculateDynamoStep();
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
