<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지구 외핵 방사형 부력 다이너모 시뮬레이션 (나선 진동 수정본)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }
        .control-panel {
            position: absolute; top: 20px; left: 20px; background: rgba(15, 15, 25, 0.85);
            padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); width: 280px; z-index: 10;
        }
        .control-panel h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #4dadff; }
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #ccc; }
        .slider-group span { float: right; font-weight: bold; color: #fff; }
        .slider-group input[type="range"] { width: 100%; accent-color: #4dadff; }
        .btn-reset { width: 100%; background: #4dadff; border: none; color: #000; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .instruction { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 14px; color: #aaa; z-index: 10; }
        .instruction span { color: #4dadff; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="control-panel">
        <h3>Dynamo 2.2 Parameters</h3>
        <div class="slider-group">
            <label>자전 각속도 (Ω): <span id="val-omega">3.0</span></label>
            <input type="range" id="slip-omega" min="0" max="10" step="0.1" value="3.0">
        </div>
        <div class="slider-group">
            <label>자기 제동 계수 (γ): <span id="val-gamma">0.2</span></label>
            <input type="range" id="slip-gamma" min="0" max="2" step="0.05" value="0.2">
        </div>
        <div class="slider-group">
            <label>방사형 부력 (a_b): <span id="val-ab">1.5</span></label>
            <input type="range" id="slip-ab" min="0" max="5" step="0.1" value="1.5">
        </div>
        <button class="btn-reset" onclick="clearTrajectories()">궤적 초기화</button>
    </div>

    <div class="instruction">
        마우스 드래그로 <span>회전</span> | 구체 내부 공간을 <span>클릭</span>하여 나선 진동 궤적 생성
    </div>

    <div id="canvas-container"></div>

    <script>
        let Omega = 3.0;
        let gamma = 0.2;
        let a_b = 1.5;
        const k_r = 3.5; // 복원력 계수 (나선 진동을 유도하는 중력 효과)
        const dt = 0.005;
        const maxSteps = 4000;

        let scene, camera, renderer, controls, earthSphere;
        let raycaster, mouse;
        let activeParticles = [];

        const slipOmega = document.getElementById('slip-omega');
        const slipGamma = document.getElementById('slip-gamma');
        const slipAb = document.getElementById('slip-ab');

        slipOmega.addEventListener('input', (e) => { Omega = parseFloat(e.target.value); document.getElementById('val-omega').innerText = Omega.toFixed(1); });
        slipGamma.addEventListener('input', (e) => { gamma = parseFloat(e.target.value); document.getElementById('val-gamma').innerText = gamma.toFixed(2); });
        slipAb.addEventListener('input', (e) => { a_b = parseFloat(e.target.value); document.getElementById('val-ab').innerText = a_b.toFixed(1); });

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 12, 16);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 가이드 구체 (반지름 4)
            const sphereGeo = new THREE.SphereGeometry(4, 32, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0x555577, wireframe: true, transparent: true, opacity: 0.1 });
            earthSphere = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(earthSphere);

            // 자전축선
            const zAxisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -6, 0), new THREE.Vector3(0, 6, 0)]);
            const zAxis = new THREE.Line(zAxisGeo, new THREE.LineBasicMaterial({ color: 0xff3333, opacity: 0.3, transparent: true }));
            scene.add(zAxis);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('click', onSphereClick, false);
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function onSphereClick(event) {
            if (event.clientX < 320 && event.clientY < 300) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earthSphere);

            if (intersects.length > 0) {
                const pt = intersects[0].point;

                const particle = {
                    x: pt.x, y: pt.z, z: pt.y,
                    vx: 0.5, vy: -0.5, vz: 0.1, // 초기 횡방향 속도 주입
                    stepCount: 0,
                    points: [pt.clone()],
                    geometry: new THREE.BufferGeometry(),
                    material: new THREE.LineBasicMaterial({ color: new THREE.Color().setHSL(Math.random(), 1.0, 0.6), linewidth: 2 }),
                    lineMesh: null
                };

                particle.lineMesh = new THREE.Line(particle.geometry, particle.material);
                scene.add(particle.lineMesh);
                activeParticles.push(particle);
            }
        }

        // --- 실시간 이산화 진동 연산 루프 ---
        function calculateDynamoStep() {
            activeParticles.forEach((p) => {
                if (p.stepCount >= maxSteps) return;

                for (let i = 0; i < 6; i++) {
                    if (p.stepCount >= maxSteps) break;

                    const R_k = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
                    const safeR = R_k < 1e-4 ? 1e-4 : R_k;

                    const l = p.x / safeR;
                    const m = p.y / safeR;
                    const n = p.z / safeR;

                    // 복원력(-k_r * 위치)이 추가되어 탈출하지 않고 코리올리 힘과 결합해 나선 진동을 만듦
                    const ax =  2 * Omega * p.vy - gamma * p.vx + a_b * l - k_r * p.x;
                    const ay = -2 * Omega * p.vx - gamma * p.vy + a_b * m - k_r * p.y;
                    const az =                   - gamma * p.vz + a_b * n - k_r * p.z;

                    p.vx += ax * dt;
                    p.vy += ay * dt;
                    p.vz += az * dt;

                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.z += p.vz * dt;

                    p.points.push(new THREE.Vector3(p.x, p.z, p.y));
                    p.stepCount++;
                }
                p.geometry.setFromPoints(p.points);
            });
        }

        function clearTrajectories() {
            activeParticles.forEach(p => { scene.remove(p.lineMesh); p.geometry.dispose(); p.material.dispose(); });
            activeParticles = [];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            calculateDynamoStep();
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
